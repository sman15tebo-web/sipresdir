<div id="view-rekap-siswa" class="view-section animate-fade-in">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-5 border-b border-gray-100 bg-gray-50/50">
            <h3 class="font-bold text-lg text-gray-800">Rekap Presensi Bulanan</h3>
            <p class="text-xs text-gray-500">Lihat dan unduh laporan kehadiran Anda (PDF).</p>
        </div>
        <div class="p-5">
            <div class="flex flex-col sm:flex-row gap-3 items-end mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
                <div class="w-full sm:flex-1">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Bulan</label>
                    <select id="rs_bulan" class="w-full border-gray-300 rounded-lg text-sm p-2.5 focus:ring-indigo-500 focus:border-indigo-500 bg-white"></select>
                </div>
                <div class="w-full sm:flex-1">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Tahun</label>
                    <input type="number" id="rs_tahun" class="w-full border-gray-300 rounded-lg text-sm p-2.5 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                </div>
                <button onclick="cariRekapSiswa()" class="w-full sm:w-auto bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-bold text-xs shadow-md hover:bg-indigo-700 transition transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-search"></i> Cari Data
                </button>
            </div>

            <div id="rs_result" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="font-bold text-gray-700 text-sm">Hasil Rekap</h4>
                    <button onclick="downloadPDFRekapSiswa()" id="btnDownloadPDFSiswa"
                        class="bg-rose-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md hover:bg-rose-600 transition flex items-center gap-2 transform active:scale-95">
                        <i class="fas fa-file-pdf"></i> Pratinjau & Unduh PDF
                    </button>
                </div>
                <div class="overflow-x-auto border border-gray-200 rounded-xl">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-500 text-[10px] uppercase font-semibold">
                            <tr>
                                <th class="p-3 text-center">Tgl/Hari</th>
                                <th class="p-3 text-center">Status</th>
                                <th class="p-3">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-rekap-siswa" class="divide-y divide-gray-100 text-xs bg-white">
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="rs_loading" class="hidden p-10 text-center text-gray-500"><i class="fas fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                <p class="text-xs font-bold mt-2">Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- Hidden print area (off-screen) -->
    <div style="position:fixed;top:0;left:-9999px;width:800px;overflow:hidden;pointer-events:none;">
        <div id="printAreaRekapSiswa" style="padding:40px 60px;width:800px;min-height:1123px;background:#fff;color:#000;font-family:'Arial',sans-serif;box-sizing:border-box;">
            <div style="display:flex;align-items:center;border-bottom:3px solid #000;padding-bottom:15px;margin-bottom:15px;">
                <img id="printLogoSiswa" src="" style="width:80px;height:80px;object-fit:contain;">
                <div style="flex:1;text-align:center;">
                    <h2 id="printNamaSekolah" style="margin:0;font-size:20px;font-weight:bold;text-transform:uppercase;">SEKOLAH</h2>
                    <p id="printProvinsi" style="margin:3px 0 0 0;font-size:14px;text-transform:uppercase;"></p>
                </div>
                <div style="width:80px;"></div>
            </div>
            <div style="text-align:center;margin-bottom:10px;">
                <h3 style="margin:0;font-size:16px;font-weight:bold;text-decoration:underline;">REKAP PRESENSI SISWA</h3>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;font-size:12px;">
                <table style="border:none;">
                    <tbody>
                        <tr><td style="padding:3px 15px 3px 0;">Nama</td><td style="padding:3px;">: <span id="printSiswaNama" style="font-weight:bold;">-</span></td></tr>
                        <tr><td style="padding:3px 15px 3px 0;">NISN</td><td style="padding:3px;">: <span id="printSiswaNISN">-</span></td></tr>
                    </tbody>
                </table>
                <table style="border:none;">
                    <tbody>
                        <tr><td style="padding:3px 15px 3px 0;">Kelas</td><td style="padding:3px;">: <span id="printSiswaKelas" style="font-weight:bold;">-</span></td></tr>
                        <tr><td style="padding:3px 15px 3px 0;">Periode</td><td style="padding:3px;">: <span id="printSiswaPeriode">-</span></td></tr>
                    </tbody>
                </table>
            </div>
            <table style="width:100%;border-collapse:collapse;margin-top:5px;font-family:Arial,sans-serif;">
                <thead>
                    <tr style="background-color:#e5e7eb;">
                        <th style="border:1px solid #000;padding:6px 4px;width:35px;text-align:center;font-size:10px;vertical-align:middle;">No</th>
                        <th style="border:1px solid #000;padding:6px 4px;width:200px;text-align:center;font-size:10px;vertical-align:middle;">Tanggal / Hari</th>
                        <th style="border:1px solid #000;padding:6px 4px;width:90px;text-align:center;font-size:10px;vertical-align:middle;">Status</th>
                        <th style="border:1px solid #000;padding:6px 4px;text-align:center;font-size:10px;vertical-align:middle;">Keterangan</th>
                    </tr>
                </thead>
                <tbody id="printTbodyRekapSiswa"></tbody>
            </table>
        </div>
    </div>

    <!-- ========== MODAL PRATINJAU PDF ========== -->
    <div id="modalPreviewPDFSiswa" class="fixed inset-0 z-[9999] hidden" style="background:rgba(15,15,30,0.75);backdrop-filter:blur(4px);">
        <div class="flex items-center justify-center w-full h-full p-3">
            <div class="bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-fade-in"
                style="width:min(92vw,900px);height:min(92vh,700px);">
                <!-- Header -->
                <div class="flex items-center justify-between px-5 py-3 flex-shrink-0"
                    style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 rounded-xl p-2.5">
                            <i class="fas fa-file-pdf text-white text-lg"></i>
                        </div>
                        <div>
                            <p class="text-white font-bold text-sm leading-tight">Pratinjau Rekap Kehadiran</p>
                            <p id="previewPDFSiswaSubtitle" class="text-white/70 text-xs"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btnDownloadFromPreviewSiswa" onclick="downloadFromPreviewSiswa()"
                            class="flex items-center gap-2 bg-white font-bold text-xs px-4 py-2 rounded-xl shadow-md transition active:scale-95 hover:bg-indigo-50"
                            style="color:#6366f1;">
                            <i class="fas fa-download"></i> Unduh PDF
                        </button>
                        <button onclick="closePreviewPDFSiswa()"
                            class="bg-white/20 hover:bg-white/30 text-white rounded-xl px-3 py-2 transition text-xs font-bold flex items-center gap-1">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <!-- Loading state saat generate -->
                <div id="previewPDFSiswaLoading" class="flex-1 flex flex-col items-center justify-center gap-3 text-gray-500">
                    <i class="fas fa-circle-notch fa-spin text-3xl" style="color:#6366f1;"></i>
                    <p class="text-sm font-semibold">Membuat pratinjau PDF...</p>
                </div>
                <!-- iframe PDF -->
                <iframe id="iframePDFSiswa"
                    class="flex-1 hidden border-0 rounded-b-2xl"
                    src="about:blank"
                    style="background:#f3f4f6;">
                </iframe>
            </div>
        </div>
    </div>

</div>
